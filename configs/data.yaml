# configs/data.yaml
#
# Phase 1 (ROADMAP.md): Data pipeline configuration for Flickr30k.
# All data-related hyperparameters and paths live here — no hardcoded
# values in source code (CLAUDE.md §6).

dataset:
  name: flickr30k
  # HuggingFace Datasets mirror — Parquet format, compatible with
  # datasets>=5.0 (nlphuji/flickr30k uses a deprecated loading script).
  # See DATASETS.md for licensing details and access-route documentation.
  source: huggingface
  hf_dataset_id: lmms-lab/flickr30k
  hf_split: test
  local_cache_dir: data/raw/flickr30k

  # Image settings (ARCHITECTURE.md §6)
  image_size: 224
  image_channels: 3

  # Text settings (ARCHITECTURE.md §3, §6)
  tokenizer_name: bert-base-uncased
  max_text_length: 77

  # Split ratios — must sum to 1.0 (split by IMAGE, not caption)
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

  # Reproducibility
  random_seed: 42

  # DataLoader settings (constrained by 6GB VRAM — ARCHITECTURE.md §6)
  #
  # Phase 0.2 profiling measured 256 as the max batch that fits under AMP
  # (4.99GB peak). Training uses 128 instead: the profiler measured a
  # forward/backward pass alone, while a real epoch also holds the
  # validation pass and the 4096-entry memory queue. 128 leaves that
  # headroom and measured ~4.6GB peak in practice.
  batch_size: 128

  # persistent_workers must stay false on Windows — the shared-memory
  # mapping it relies on fails there partway into training. prefetch_factor
  # of 4 recovers most of the throughput that costs.
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 4
  drop_last: true

# Image normalization (ImageNet-standard — reasonable for from-scratch)
transforms:
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  random_horizontal_flip_p: 0.5
  resize_size: 256
