# configs/training.yaml
#
# Phase 4 (ROADMAP.md): Production training hyperparameters.
# All optimizer, scheduler, and training settings live here —
# no hardcoded values in source code (CLAUDE.md §6).
#
# This config is consumed by scripts/train.py and the benchmark script.
# Function defaults in src/ are fallbacks only.
#
# Hardware constraint: RTX 4050 Laptop GPU, 6GB VRAM (ARCHITECTURE.md §6).
# Measured max safe batch size: 256 (Phase 0.2), but 128 used in practice
# to leave headroom for validation and memory queue (see performance report).

# --- Optimizer (ARCHITECTURE.md §8) ---
optimizer:
  type: adamw
  lr: 1.0e-3
  weight_decay: 0.01

# --- Learning Rate Schedule ---
scheduler:
  type: cosine_annealing
  T_max: 20           # epochs — spans full training budget
  eta_min: 1.0e-6     # minimum LR at end of schedule

# --- Gradient Accumulation ---
# Effective batch = accumulation_steps * batch_size (data.yaml)
# Keep as 1 unless memory forces a smaller per-step batch.
gradient_accumulation_steps: 1

# --- Gradient Clipping ---
# Max gradient L2 norm. Set to 0 to disable.
# Helps stabilize early training when gradients can spike.
gradient_clip_max_norm: 1.0

# --- Uniformity regularizer (docs/KNOWN_ISSUES.md §12) ---
#
# Wang & Isola's uniformity term, which spreads embeddings over the
# hypersphere. It was added to target the one health threshold the
# InfoNCE-only model failed: ||mean embedding|| 0.577 against a 0.5
# ceiling.
#
# 0.2 is the shipped weight, chosen from a three-point sweep rather than
# from the first value that worked (EXPERIMENTS.md 009):
#
#   w      ||mean||   separation   R@10 (i2t)   R@10 (t2i)
#   0.0     0.577        0.356       29.30%       24.92%
#   0.1     0.246        0.473       26.75%       24.44%
#   0.2     0.154        0.490       29.17%       26.22%
#   0.5     0.176        0.481       27.28%          —
#
# 0.2 is the only setting that passes all three health thresholds while
# costing essentially nothing: -0.13pp image->text, +1.30pp text->image.
# w=0.5 was measured first and rejected at -2.0pp; shipping it on that
# one run would have repeated §11's mistake.
#
# 0.0 reproduces InfoNCE-only training exactly, so changing this is a
# one-value A/B rather than a code change. Move it only with a
# controlled comparison — separation and uniformity trade against each
# other, and w=0.1 is the counter-example that keeps this honest: more
# regularization than 0.0, worse retrieval than either neighbour.
uniformity:
  weight: 0.2
  t: 2.0

# --- Memory Queue (ARCHITECTURE.md §6) ---
memory_queue:
  # Off by default, and this default is a result rather than a
  # preference: a controlled A/B from a shared checkpoint measured the
  # queue costing 87% of Recall@10 and 81% of separation, because
  # without a momentum encoder its 4096 stale entries outnumber the
  # in-batch negatives 32:1 and the cheapest way to fit them is to
  # inflate the logit scale until the space collapses (EXPERIMENTS.md
  # 006, KNOWN_ISSUES.md §11).
  #
  # ARCHITECTURE.md §6 has described this default since the A/B; the key
  # itself was missing until 2026-08-25, so `python scripts/train.py`
  # with no flags trained *with* the queue and reproduced the collapse.
  # --queue re-enables it for anyone re-running the experiment.
  enabled: false

  # Size of the MoCo-style negative embedding queue.
  # Recommended: 16 * batch_size (CLAUDE.md §9). With batch_size=128,
  # that's 2048. Using 4096 for maximum negative diversity.
  queue_size: 4096

  # Epochs to train on in-batch negatives alone before the queue starts
  # serving negatives. It still fills during warmup, so it is full of
  # recent embeddings the moment it activates.
  #
  # This is not a tuning preference. Real MoCo pairs its queue with a
  # momentum encoder that keeps queued keys consistent; this project has
  # none, so early queue entries come from an encoder that has since
  # moved. At 4096 against a batch of 128 they outnumber in-batch
  # negatives 32:1 and swamp the gradient.
  #
  # Measured: queue active from step 1 left the model at chance
  # (val R@10 0.35%) after two epochs. Warming up first reached 17.12%
  # by epoch 6, then gained 3.1pp when the queue came on. Phase 4's best
  # result used exactly this schedule by accident — a forgotten
  # --no-queue flag. See EXPERIMENTS.md experiment 004.
  warmup_epochs: 6

# --- Training Schedule ---
epochs: 20
log_every_n_steps: 50
eval_every_n_epochs: 1
save_every_n_epochs: 2

# --- Early Stopping ---
# Monitor val recall@1. Stop if no improvement for `patience` epochs.
early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.001     # minimum improvement required

# --- Reproducibility ---
random_seed: 42

# --- Checkpointing ---
checkpoint_dir: checkpoints/train
log_dir: logs/train

# --- Temperature / logit scale (ARCHITECTURE.md §5) ---
# Initialized from model config (log(1/0.07) per CLIP) and learned —
# no manual scheduling.
temperature:
  # Hard ceiling on the learnable logit scale, applied after every
  # optimizer step. CLIP uses 100.
  #
  # This is not a tuning knob, it is a correctness guard. The scalar is
  # unconstrained, and the optimizer can lower contrastive loss by
  # inflating it instead of separating representations. Phase 4 ran
  # without this clamp: the scale went 14.3 -> 55 -> 500+ while the
  # embedding space collapsed into a narrow cone (mean off-diagonal
  # cosine 0.81, matched-vs-unmatched separation 0.094). See
  # docs/KNOWN_ISSUES.md §1 and EXPERIMENTS.md experiment 002.
  max_logit_scale: 100.0
  clamp_enabled: true
