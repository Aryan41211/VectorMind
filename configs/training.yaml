# configs/training.yaml
#
# Phase 4 (ROADMAP.md): Production training hyperparameters.
# All optimizer, scheduler, and training settings live here —
# no hardcoded values in source code (CLAUDE.md §6).
#
# This config is consumed by scripts/train.py and the benchmark script.
# Function defaults in src/ are fallbacks only.
#
# Hardware constraint: RTX 4050 Laptop GPU, 6GB VRAM (ARCHITECTURE.md §6).
# Measured max safe batch size: 256 (Phase 0.2), but 128 used in practice
# to leave headroom for validation and memory queue (see performance report).

# --- Optimizer (ARCHITECTURE.md §8) ---
optimizer:
  type: adamw
  lr: 1.0e-3
  weight_decay: 0.01

# --- Learning Rate Schedule ---
scheduler:
  type: cosine_annealing
  T_max: 10           # epochs — matches total epochs
  eta_min: 1.0e-6     # minimum LR at end of schedule

# --- Gradient Accumulation ---
# Effective batch = accumulation_steps * batch_size (data.yaml)
# Keep as 1 unless memory forces a smaller per-step batch.
gradient_accumulation_steps: 1

# --- Gradient Clipping ---
# Max gradient L2 norm. Set to 0 to disable.
# Helps stabilize early training when gradients can spike.
gradient_clip_max_norm: 1.0

# --- Memory Queue (ARCHITECTURE.md §6) ---
memory_queue:
  # Size of the MoCo-style negative embedding queue.
  # Recommended: 16 * batch_size (CLAUDE.md §9). With batch_size=128,
  # that's 2048. Using 4096 for maximum negative diversity.
  queue_size: 4096

# --- Training Schedule ---
epochs: 10
log_every_n_steps: 50
eval_every_n_epochs: 1
save_every_n_epochs: 2

# --- Early Stopping ---
# Monitor val recall@1. Stop if no improvement for `patience` epochs.
early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.001     # minimum improvement required

# --- Reproducibility ---
random_seed: 42

# --- Checkpointing ---
checkpoint_dir: checkpoints/train
log_dir: logs/train

# --- Temperature (ARCHITECTURE.md §5) ---
# Initialized from model config (log(1/0.07) per CLIP).
# The model learns this — no manual scheduling.
