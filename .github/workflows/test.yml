# VectorMind CI — Test, type-check, lint
#
# Runs on every push and pull request:
#   - Python: pytest, mypy, ruff
#   - TypeScript: tsc --noEmit, oxlint, production build
#
# Enforces CLAUDE.md §4 ("never break existing tests") and the §3 rules
# on type hints and docstrings, which were written down but never
# actually checked by anything until now.

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest, mypy, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # CPU-only torch: the GPU wheels are ~2.5GB and CI has no GPU.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # Editable install puts `vectormind` on sys.path. Without it,
          # backend/ imports resolve only by accident of the working
          # directory — the same gap that broke the Docker image.
          pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src/vectormind backend

      - name: Test (pytest)
        run: pytest tests/ -q --tb=short

  serving-deps:
    name: Serving dependency set is sufficient
    runs-on: ubuntu-latest
    # requirements-serving.txt is what the Docker image installs. If it
    # drifts from what backend/ imports, the image breaks and nothing
    # else catches it — the dev environment has everything installed, so
    # the other jobs would still pass.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serving.txt

      - name: Install serving dependencies only
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-serving.txt
          pip install --no-deps -e .

      - name: Import the app
        run: python -c "import backend.app; print('serving deps sufficient')"

  typescript:
    name: TypeScript (tsc, oxlint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
