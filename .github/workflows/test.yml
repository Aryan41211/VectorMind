# VectorMind CI — Test, type-check, lint
#
# Runs on every push and pull request:
#   - Python: pytest, mypy, ruff
#   - TypeScript: tsc --noEmit, oxlint, production build
#
# Enforces CLAUDE.md §4 ("never break existing tests") and the §3 rules
# on type hints and docstrings, which were written down but never
# actually checked by anything until now.

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest, mypy, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # CPU-only torch: the GPU wheels are ~2.5GB and CI has no GPU.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # Editable install puts `vectormind` on sys.path. Without it,
          # backend/ imports resolve only by accident of the working
          # directory — the same gap that broke the Docker image.
          pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src/vectormind backend

      - name: Test (pytest)
        run: pytest tests/ -q --tb=short

  serving-deps:
    name: Serving dependency set is sufficient
    runs-on: ubuntu-latest
    # requirements-serving.txt is what the Docker image installs. If it
    # drifts from what backend/ imports, the image breaks and nothing
    # else catches it — the dev environment has everything installed, so
    # the other jobs would still pass.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serving.txt

      - name: Install serving dependencies only
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-serving.txt
          pip install --no-deps -e .

      - name: Import the app
        run: python -c "import backend.app; print('serving deps sufficient')"

  deployment:
    name: Deployment config (Caddy, compose, response headers)
    runs-on: ubuntu-latest
    # Nothing validated deployment/ until now, and every file in it sits on
    # the path to the one unfinished Phase 7 deliverable. Three defects
    # shipped there undetected, because `nginx -t` during the image build
    # was the only gate and it checks one file's syntax:
    #
    #   - the Caddyfile did not parse at all (`transport` is a subdirective
    #     of reverse_proxy, not a site-level directive), so the TLS overlay
    #     could never have started;
    #   - the TLS overlay's loopback rebinding was appended to the base
    #     file's port list rather than replacing it, leaving nginx bound on
    #     0.0.0.0 — the opposite of the overlay's stated purpose;
    #   - every static response was missing all four security headers,
    #     because nginx drops the inherited add_header set in any location
    #     that declares an add_header of its own.
    #
    # Syntax checks catch the first two. Only asserting on real responses
    # catches the third, so this job does both.
    steps:
      - uses: actions/checkout@v4

      - name: Caddyfile parses
        run: |
          docker run --rm \
            -e DOMAIN=demo.example.com -e TLS_EMAIL=ci@example.com \
            -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Compose files are valid in every documented combination
        env:
          DOMAIN: demo.example.com
          TLS_EMAIL: ci@example.com
        working-directory: deployment
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.auth.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.tls.yml \
                         -f docker-compose.auth.yml config -q

      - name: TLS overlay publishes the app on loopback only
        env:
          DOMAIN: demo.example.com
          TLS_EMAIL: ci@example.com
        working-directory: deployment
        # Compose merges sequences by appending. Without `!override` the
        # base file's 0.0.0.0 mapping survives alongside this one and the
        # app stays reachable on every interface, bypassing the TLS
        # terminator this overlay exists to put in front of it.
        run: |
          ports=$(docker compose -f docker-compose.yml -f docker-compose.tls.yml \
                    config --format json | jq -c '.services.frontend.ports')
          echo "frontend ports: $ports"
          test "$(echo "$ports" | jq 'length')" = "1" \
            || { echo "expected exactly one frontend port mapping"; exit 1; }
          test "$(echo "$ports" | jq -r '.[0].host_ip')" = "127.0.0.1" \
            || { echo "frontend is not published on loopback only"; exit 1; }

      - name: Build the frontend image
        run: docker build -f deployment/frontend.Dockerfile -t vectormind-frontend:ci .

      - name: Every response carries the security headers exactly once
        # Asserted against real responses rather than by reading the config.
        # The headers were previously checked on a proxied API path — one of
        # the few locations that did inherit them — and the result recorded
        # as "all four present", which was true of that path and of nothing
        # else the browser actually loads.
        run: |
          docker run -d --name hdr-ci -p 8099:80 vectormind-frontend:ci
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8099/nginx-health >/dev/null && break
            sleep 1
          done
          asset=$(docker exec hdr-ci sh -c 'basename $(ls /usr/share/nginx/html/assets/*.js | head -1)')
          fail=0
          for path in / /nginx-health /some/spa/route "/assets/$asset"; do
            h=$(curl -sS -D - -o /dev/null "http://127.0.0.1:8099$path")
            for name in X-Content-Type-Options X-Frame-Options Referrer-Policy Permissions-Policy; do
              n=$(printf '%s' "$h" | grep -ci "^$name:" || true)
              test "$n" = "1" || { echo "FAIL $path: $name seen $n times, want 1"; fail=1; }
            done
            # `expires` alongside an add_header emits two Cache-Control
            # headers, and which one a cache honours is unspecified.
            n=$(printf '%s' "$h" | grep -ci '^Cache-Control:' || true)
            test "$n" -le 1 || { echo "FAIL $path: Cache-Control seen $n times"; fail=1; }
            # add_header Content-Type appends rather than replacing, so the
            # health probe returned both octet-stream and text/plain.
            n=$(printf '%s' "$h" | grep -ci '^Content-Type:' || true)
            test "$n" -le 1 || { echo "FAIL $path: Content-Type seen $n times"; fail=1; }
            test "$fail" = 0 && echo "ok $path"
          done
          docker rm -f hdr-ci >/dev/null
          exit $fail

      - name: PowerShell scripts parse
        # The Windows deploy/preflight/verify scripts are now the front
        # door to the public path; a syntax error in any of them would
        # surface only on the deploy machine. GitHub runners ship pwsh.
        shell: pwsh
        run: |
          foreach ($f in @("deployment/preflight.ps1", "deployment/deploy.ps1", "deployment/verify.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($e in $errors) { Write-Host "FAIL $f line $($e.Extent.StartLineNumber): $($e.Message)" }
              exit 1
            }
            Write-Host "parse OK: $f"
          }

  typescript:
    name: TypeScript (tsc, oxlint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
