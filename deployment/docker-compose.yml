# VectorMind — Docker Compose
#
# Two services: the FastAPI backend (model + FAISS) and an nginx
# container serving the built SPA and proxying the API. Everything is
# reached through the frontend on port 80, so the deployed app is
# same-origin and CORS never enters the picture.
#
#   docker compose -f deployment/docker-compose.yml up --build
#
# The checkpoint, indices, and Flickr30k images are mounted read-only
# rather than baked in: the checkpoint is ~278MB and the image set 1.3GB,
# and neither belongs in a rebuilt layer.

services:
  backend:
    # Named so the artifact can be built once and reused, rather than
    # compose inventing a project-scoped tag that nothing else can refer to.
    image: vectormind-backend:latest
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    # Not published to the host. The frontend reaches it over the compose
    # network, so there is no reason to expose a second port publicly.
    expose:
      - "8000"
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../backend/indices:/app/backend/indices:ro
      - ../data/raw/flickr30k/images:/app/data/raw/flickr30k/images:ro
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      # Probes /ready, not /health: the container is only useful once the
      # checkpoint and indices are loaded, and depends_on below waits on
      # this. Routing traffic on liveness alone would send every early
      # search into a 503.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready').status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Loading a ~278MB checkpoint takes tens of seconds; without this
      # grace period the container is killed while starting normally.
      start_period: 90s
    restart: unless-stopped
    # A runaway request should not take the host down with it.
    deploy:
      resources:
        limits:
          memory: 4G

  frontend:
    image: vectormind-frontend:latest
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    ports:
      # Configurable because port 80 is frequently already taken on a
      # development machine (IIS, another proxy, Docker Desktop itself),
      # and a port collision is a confusing first failure for someone
      # following the README.
      #   FRONTEND_PORT=3000 docker compose -f deployment/docker-compose.yml up
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: nginx binds IPv4-only (0.0.0.0:80) while
      # busybox wget resolves localhost to ::1 and does not fall back, so
      # the check failed against a container that was serving fine.
      #
      # CMD-SHELL, not CMD: in exec form the shell operators below are
      # passed to wget as extra arguments rather than interpreted.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
