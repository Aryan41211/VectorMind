# nginx for the VectorMind frontend container.
#
# Serves the built SPA and reverse-proxies the API paths to the backend
# container. Proxying rather than pointing the browser straight at
# :8000 means the whole app is same-origin, so CORS stops being part of
# the deployment at all — one less thing to misconfigure, and no
# preflight round trip before every search.

upstream vectormind_backend {
    # `backend` is the compose service name, resolved on the shared network.
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend enforces its own limit; this refuses oversized uploads
    # one hop earlier, before they are proxied anywhere.
    client_max_body_size 10m;

    # Do not advertise the nginx version to the internet.
    server_tokens off;

    # Mirrors the headers the API sets, so static responses are not the
    # weak link. HSTS is deliberately absent — it belongs wherever TLS
    # actually terminates, which is not this container.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        image/svg+xml;

    # --- API ---
    location ~ ^/(search|health|ready|api|docs|openapi.json) {
        proxy_pass http://vectormind_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend's rate limiter keys on the left-most entry, so this
        # must be appended rather than overwritten or every client
        # collapses into one bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold start loads a ~278MB checkpoint before the first search
        # returns. The default 60s read timeout would cut that off and
        # show a 504 during exactly the window a visitor is most likely
        # to arrive in.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # --- Dataset images, served by the backend ---
    location /images/ {
        proxy_pass http://vectormind_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Flickr30k filenames are stable and the corpus never changes.
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Static assets ---
    # Vite content-hashes these filenames, so a long immutable cache is
    # safe: a changed file gets a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- SPA fallback ---
    # index.html must never be cached, or a visitor keeps loading an old
    # document that references asset filenames the new deploy deleted.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
