# nginx for the VectorMind frontend container.
#
# Serves the built SPA and reverse-proxies the API paths to the backend
# container. Proxying rather than pointing the browser straight at :8000
# means the whole app is same-origin, so CORS stops being part of the
# deployment at all — one less thing to misconfigure, and no preflight
# round trip before every search.
#
# On upstream resolution. An `upstream backend { server backend:8000; }`
# block would be the obvious spelling, but nginx resolves those names at
# configuration-load time. That breaks twice: `nginx -t` fails during
# the image build, when no compose network exists, and a backend
# container that restarts with a new IP is never re-resolved because
# nginx cached the old one at startup.
#
# Using Docker's embedded DNS (127.0.0.11) with the target in a variable
# defers resolution to request time, which fixes both. The cost is that
# a variable `proxy_pass` no longer forwards the request URI
# automatically, so $request_uri is appended explicitly below.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. valid=10s bounds how long a stale address
    # survives a backend restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host "http://backend:8000";

    # Optional HTTP Basic auth for a private demo.
    #
    # The trailing * makes this an optional include: with no matching
    # file nginx skips it silently, so local development needs no
    # credentials. Mount deployment/auth.conf and an .htpasswd to turn
    # the gate on — see docs/DEPLOYMENT.md.
    #
    # Basic auth sends credentials base64-encoded, which is encoding and
    # not encryption. It is meaningful only behind TLS. Over plain HTTP
    # it keeps a link out of search results and casual hands; it is not
    # a security control.
    include /etc/nginx/conf.d/auth.conf*;

    # The backend enforces its own limit; this refuses oversized uploads
    # one hop earlier, before they are proxied anywhere.
    client_max_body_size 10m;

    # Do not advertise the nginx version.
    server_tokens off;

    # Mirrors the headers the API sets, so static responses are not the
    # weak link. HSTS is deliberately absent — it belongs wherever TLS
    # actually terminates, which is not this container.
    #
    # Repeated inside every location below, because nginx replaces the
    # inherited add_header set the moment a location declares one of its
    # own. See deployment/security-headers.inc.
    include /etc/nginx/snippets/security-headers.inc;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        image/svg+xml;

    # --- API ---
    location ~ ^/(search|health|ready|api|docs|openapi\.json) {
        proxy_pass $backend_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend's rate limiter keys on the left-most entry, so this
        # must append rather than overwrite or every client collapses
        # into one bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API sets the same security headers, and nginx re-adds them
        # below, so a proxied response would carry each one twice.
        # Identical duplicates are harmless to browsers but confuse
        # scanners and log parsers; drop the upstream copies and let this
        # server block be the single source.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/snippets/security-headers.inc;

        # A cold start loads a ~278MB checkpoint before the first search
        # returns. The default 60s read timeout would cut that off and
        # show a 504 during exactly the window a visitor is most likely
        # to arrive in.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # --- Dataset images, served by the backend ---
    location /images/ {
        proxy_pass $backend_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/snippets/security-headers.inc;

        # Flickr30k filenames are stable and the corpus never changes.
        #
        # One directive, not `expires` plus an add_header: those emit two
        # separate Cache-Control headers, and which one a cache honours is
        # not specified.
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --- Container liveness, never gated, never proxied ---
    # The healthcheck must not depend on basic auth (a 401 would get the
    # container killed as unhealthy) and must not depend on the backend
    # either — nginx being up is a separate question from the model
    # being loaded, and conflating them means a slow model start looks
    # like a broken web server.
    location = /nginx-health {
        auth_basic off;
        access_log off;
        include /etc/nginx/snippets/security-headers.inc;
        # default_type, not `add_header Content-Type`: add_header appends,
        # so the response carried both application/octet-stream and
        # text/plain.
        default_type text/plain;
        return 200 "ok
";
    }

    # --- Backend probes, never gated ---
    # The container healthcheck and any uptime monitor hit these. Behind
    # basic auth they would return 401 and the container would be killed
    # as unhealthy, which is a confusing way to discover you enabled a
    # password.
    location = /health {
        auth_basic off;
        proxy_pass $backend_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/snippets/security-headers.inc;
    }

    location = /ready {
        auth_basic off;
        proxy_pass $backend_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        include /etc/nginx/snippets/security-headers.inc;
    }

    # --- Static assets ---
    # Vite content-hashes these filenames, so a long immutable cache is
    # safe: a changed file gets a new name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.inc;
        # One Cache-Control header, not `expires` plus an add_header,
        # which emitted two.
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    # --- SPA fallback ---
    # index.html must never be cached, or a visitor keeps loading an old
    # document that references asset filenames the new deploy deleted.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
}
